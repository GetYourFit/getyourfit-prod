name: Acceptance

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm ci --prefix tests/acceptance
      - run: npx playwright install --with-deps chromium
        working-directory: tests/acceptance
      - name: Prove the checker rejects known failures
        run: npm run acceptance:stubs --prefix tests/acceptance
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/acceptance/proof
      - name: Check the production build
        if: ${{ !cancelled() }}
        run: npm run acceptance
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/acceptance/production
      - name: Preserve acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: error
          retention-days: 7
