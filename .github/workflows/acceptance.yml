name: Acceptance

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GYF_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm ci --prefix tests/acceptance
      - run: npx playwright install --with-deps chromium
        working-directory: tests/acceptance
      - name: Prove the checker rejects known failures
        run: npm run acceptance:stubs --prefix tests/acceptance
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/acceptance/proof
      - name: Check the production build
        if: ${{ !cancelled() }}
        run: npm run acceptance
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/acceptance/production
      - name: Check the production build against Postgres
        if: ${{ !cancelled() }}
        run: npm run acceptance:postgres
        env:
          ACCEPTANCE_OUTPUT: ${{ runner.temp }}/acceptance/production-postgres
      - name: Preserve acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/acceptance
          if-no-files-found: error
          retention-days: 7
