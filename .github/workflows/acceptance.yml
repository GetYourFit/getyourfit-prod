name: acceptance

on:
  pull_request:
  push:

jobs:
  acceptance:
    name: acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tests/acceptance
      - run: npx --prefix tests/acceptance playwright install --with-deps chromium
      - run: npm run acceptance:stubs --prefix tests/acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          path: tests/acceptance/results/
