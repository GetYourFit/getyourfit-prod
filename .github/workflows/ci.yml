name: CI

on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - 'index.html'
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'docs/**'
      - '.cursor/skills/verify-getyourfit/**'
      - 'src/verification/**'
      - 'README.md'
      - 'DESIGN.md'
      - 'FEATURE_MAP.md'
  push:
    paths:
      - '.github/workflows/ci.yml'
      - '.gitignore'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - 'index.html'
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'docs/**'
      - '.cursor/skills/verify-getyourfit/**'
      - 'src/verification/**'
      - 'README.md'
      - 'DESIGN.md'
      - 'FEATURE_MAP.md'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run feature-map && git diff --exit-code
