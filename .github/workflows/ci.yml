name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # The pinned Playwright image fixes the browser build and system libraries, so screenshot baselines stay comparable.
    container: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    # Supabase runs Postgres 17. The container runs as root, which an embedded Postgres refuses, so a service container supplies the database.
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GYF_TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      GYF_DATABASE_SSL: disable
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Check accessibility, design rules, and visual regression
        run: npm run test:ui
        env:
          UI_OUTPUT: ${{ runner.temp }}/ui
      - name: Preserve UI screenshots and diffs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: ui-quality-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ui
            tests/ui/screenshots/linux
          if-no-files-found: ignore
          retention-days: 7
